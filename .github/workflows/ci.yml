name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 單元＋整合測試（Testcontainers 使用 runner 內建的 Docker）
      - name: 測試與打包
        run: ./mvnw -B -ntp verify -Dsurefire.useFile=false -DtrimStackTrace=false

      - name: 建置 Docker image
        run: docker build -t couple-quest-board-backend:ci .
