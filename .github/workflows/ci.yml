name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 單元＋整合測試（Testcontainers 使用 runner 內建的 Docker）
      - name: 測試與打包
        run: ./mvnw -B -ntp verify -Dsurefire.useFile=false -DtrimStackTrace=false

      - name: 建置 Docker image
        run: docker build -t couple-quest-board-backend:ci .

      # B0 完成標準：以正式 image＋開發覆寫檔起 app＋db，/api/auth/me 回傳開發模式使用者
      - name: Compose 冒煙測試
        env:
          APP_VERSION: ci
        run: |
          cp .env.example .env
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 2
          done
          echo
          curl -fsS http://localhost:3000/api/auth/me | tee /tmp/me.json
          echo
          grep -q '"email":"dev@example.com"' /tmp/me.json

      - name: Compose 紀錄
        if: always()
        run: docker compose logs --no-color || true
